<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OfflineEats — Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#15302B;
    --ink-deep:#0E211D;
    --paper:#F3EFE6;
    --marigold:#E8A33D;
    --marigold-deep:#C97F1F;
    --chili:#C1432E;
    --sage:#7C9A82;
    --line:rgba(243,239,230,0.14);
    --card:#1B3A33;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:#0A1210;
    font-family:'IBM Plex Sans', sans-serif;
    display:flex; align-items:flex-start; justify-content:center;
    min-height:100vh; padding:36px 16px;
  }
  .stage{display:flex; flex-direction:column; align-items:center; gap:14px;}
  .stage-label{color:#6f8b83; font-size:13px; letter-spacing:0.02em;}
  .phone{
    width:390px; height:800px;
    background:var(--ink);
    border-radius:44px;
    border:8px solid #06110E;
    box-shadow:0 40px 80px rgba(0,0,0,0.55), 0 0 0 1px rgba(255,255,255,0.03);
    overflow:hidden;
    position:relative;
    display:flex; flex-direction:column;
  }
  .notch{
    position:absolute; top:0; left:50%; transform:translateX(-50%);
    width:120px; height:26px; background:#06110E; border-radius:0 0 16px 16px; z-index:50;
  }
  .statusbar{
    height:46px; display:flex; align-items:center; justify-content:space-between;
    padding:0 26px; color:var(--paper); font-size:13px; font-weight:600; flex-shrink:0;
  }
  .netbadge{
    margin:0 16px 10px 16px; padding:9px 14px; border-radius:10px;
    display:flex; align-items:center; justify-content:space-between; gap:8px;
    font-size:12.5px; cursor:pointer; transition:background 0.25s ease; flex-shrink:0;
    border:1px solid var(--line);
  }
  .netbadge.online{background:rgba(124,154,130,0.16); color:#BFE0C6;}
  .netbadge.offline{background:rgba(193,67,46,0.16); color:#F2B6A9;}
  .netbadge .dot{width:7px; height:7px; border-radius:50%; flex-shrink:0;}
  .netbadge.online .dot{background:#7CD68A;}
  .netbadge.offline .dot{background:var(--chili);}
  .netbadge .toggle-hint{font-size:11px; opacity:0.65; font-weight:500;}

  .screen{flex:1; overflow-y:auto; padding-bottom:90px;}
  .screen::-webkit-scrollbar{display:none;}

  .header{padding:4px 20px 14px 20px;}
  .header h1{
    font-family:'Fraunces', serif; font-weight:600; font-size:26px; color:var(--paper);
    letter-spacing:0.01em;
  }
  .header .loc{color:var(--sage); font-size:13px; margin-top:4px;}

  .searchrow{margin:0 20px 16px 20px; display:flex; gap:8px;}
  .searchbox{
    flex:1; background:var(--card); border:1px solid var(--line); border-radius:12px;
    padding:12px 14px; color:var(--paper); font-size:14px; display:flex; align-items:center; gap:8px;
  }
  .searchbox input{
    background:none; border:none; outline:none; color:var(--paper); font-size:14px; width:100%;
    font-family:'IBM Plex Sans', sans-serif;
  }
  .searchbox input::placeholder{color:#7f958e;}
  .ai-btn{
    background:var(--marigold); color:var(--ink-deep); border:none; border-radius:12px;
    padding:0 16px; font-weight:600; font-size:13px; cursor:pointer; white-space:nowrap;
  }
  .ai-btn:active{background:var(--marigold-deep);}

  .chiprow{display:flex; gap:8px; padding:0 20px 16px 20px; overflow-x:auto;}
  .chip{
    border:1px solid var(--line); color:var(--sage); font-size:12.5px; padding:7px 13px;
    border-radius:999px; white-space:nowrap; cursor:pointer; flex-shrink:0; background:transparent;
    font-family:'IBM Plex Sans', sans-serif;
  }
  .chip.active{background:var(--marigold); color:var(--ink-deep); border-color:var(--marigold); font-weight:600;}

  .sectiontitle{
    color:var(--paper); font-family:'Fraunces', serif; font-size:16px; font-weight:600;
    padding:6px 20px 10px 20px;
  }
  .sectiontitle .sub{color:var(--sage); font-family:'IBM Plex Sans', sans-serif; font-weight:400; font-size:12px; display:block; margin-top:2px;}

  .card{
    margin:0 20px 12px 20px; background:var(--card); border-radius:16px; border:1px solid var(--line);
    padding:14px; display:flex; gap:12px; cursor:pointer; transition:border-color 0.2s;
  }
  .card:active{border-color:var(--marigold);}
  .thumb{
    width:64px; height:64px; border-radius:12px; flex-shrink:0;
    display:flex; align-items:center; justify-content:center; font-size:24px;
  }
  .card-body{flex:1; min-width:0;}
  .card-top{display:flex; justify-content:space-between; align-items:baseline; gap:8px;}
  .card-name{color:var(--paper); font-weight:600; font-size:15px; font-family:'Fraunces', serif;}
  .card-price{color:var(--marigold); font-size:13px; font-weight:600; flex-shrink:0;}
  .card-cuisine{color:var(--sage); font-size:12.5px; margin-top:2px;}
  .card-meta{display:flex; gap:12px; margin-top:8px; font-size:12px; color:#9fb3ac;}
  .card-meta .rating{color:#EFD08C; font-weight:600;}
  .ai-note{
    margin-top:8px; font-size:11.5px; color:#BFE0C6; background:rgba(124,154,130,0.12);
    padding:5px 9px; border-radius:7px; display:inline-block;
  }

  .navbar{
    position:absolute; bottom:0; left:0; right:0; height:78px;
    background:var(--ink-deep); border-top:1px solid var(--line);
    display:flex; align-items:center; justify-content:space-around; padding-bottom:14px; z-index:40;
  }
  .navitem{
    display:flex; flex-direction:column; align-items:center; gap:4px; cursor:pointer;
    color:#6f8b83; font-size:10.5px; font-weight:500; width:64px;
  }
  .navitem.active{color:var(--marigold);}
  .navicon{font-size:19px;}

  .detail-hero{
    height:150px; margin:0 20px 14px 20px; border-radius:16px;
    display:flex; align-items:flex-end; padding:14px; font-size:44px;
  }
  .backrow{padding:14px 20px 4px 20px; color:var(--sage); font-size:13px; cursor:pointer; display:flex; align-items:center; gap:6px;}
  .detail-name{font-family:'Fraunces', serif; font-size:24px; font-weight:600; color:var(--paper); padding:0 20px;}
  .detail-meta{padding:8px 20px 16px 20px; color:var(--sage); font-size:13px; display:flex; gap:14px; flex-wrap:wrap;}
  .detail-meta b{color:var(--marigold);}
  .menusec{padding:0 20px;}
  .menu-item{
    display:flex; justify-content:space-between; padding:11px 0; border-bottom:1px solid var(--line);
    color:var(--paper); font-size:14px;
  }
  .menu-item .mname{font-weight:500;}
  .menu-item .mdesc{color:#8fa39c; font-size:11.5px; margin-top:2px;}
  .menu-item .mprice{color:var(--marigold); font-weight:600; flex-shrink:0; margin-left:12px;}

  .empty{padding:60px 30px; text-align:center; color:var(--sage);}
  .empty .big{font-size:32px; margin-bottom:10px;}
  .empty .t1{color:var(--paper); font-family:'Fraunces', serif; font-size:17px; margin-bottom:6px;}
  .empty .t2{font-size:13px; line-height:1.5;}

  .ai-answer{
    margin:0 20px 16px 20px; background:rgba(232,163,61,0.1); border:1px solid rgba(232,163,61,0.35);
    border-radius:14px; padding:14px;
  }
  .ai-answer .lbl{color:var(--marigold); font-size:11.5px; font-weight:700; letter-spacing:0.02em; margin-bottom:6px;}
  .ai-answer .txt{color:var(--paper); font-size:13.5px; line-height:1.5;}

  .sync-block{margin:0 20px 16px 20px; background:var(--card); border:1px solid var(--line); border-radius:14px; padding:16px;}
  .sync-block .row{display:flex; justify-content:space-between; padding:8px 0; font-size:13px; color:var(--sage); border-bottom:1px solid var(--line);}
  .sync-block .row:last-child{border-bottom:none;}
  .sync-block .row b{color:var(--paper); font-weight:600;}
  .sync-btn{
    width:100%; margin-top:12px; background:var(--marigold); color:var(--ink-deep); border:none;
    border-radius:10px; padding:12px; font-weight:600; font-size:13.5px; cursor:pointer;
  }
  .sync-btn:disabled{background:#3a4a44; color:#7f958e; cursor:not-allowed;}
</style>
</head>
<body>

<div class="stage">
  <div class="stage-label">OfflineEats — click the status badge at the top to toggle airplane mode</div>
  <div class="phone">
    <div class="notch"></div>
    <div class="statusbar">
      <span id="clock">9:41</span>
      <span id="sigicon">●●●● 5G</span>
    </div>

    <div id="netbadge" class="netbadge online" onclick="toggleNet()">
      <span style="display:flex;align-items:center;gap:8px;">
        <span class="dot"></span>
        <span id="netlabel">Online · Synced just now</span>
      </span>
      <span class="toggle-hint">tap to test offline</span>
    </div>

    <div id="screen" class="screen"></div>

    <div class="navbar">
      <div class="navitem active" data-tab="home" onclick="setTab('home')"><span class="navicon">⌂</span>Home</div>
      <div class="navitem" data-tab="ai" onclick="setTab('ai')"><span class="navicon">✦</span>AI Search</div>
      <div class="navitem" data-tab="saved" onclick="setTab('saved')"><span class="navicon">♡</span>Saved</div>
      <div class="navitem" data-tab="sync" onclick="setTab('sync')"><span class="navicon">⟳</span>Sync</div>
    </div>
  </div>
</div>

<script>
const DATA = [
  {id:1, name:"Chutney's Tiffin", cuisine:"South Indian · Tiffin", price:280, dist:0.6, rating:4.5, emoji:"🥞", color:"#2E5148",
    hours:"7:00 AM – 10:30 PM", menu:[["Masala Dosa","Crisp, potato filling",90],["Idli Sambar","Steamed rice cakes, 4pc",70],["Filter Coffee","South Indian classic",40]]},
  {id:2, name:"Bhukkad Da Dhaba", cuisine:"North Indian · Punjabi", price:450, dist:1.2, rating:4.3, emoji:"🍛", color:"#4A3B24",
    hours:"11:00 AM – 11:00 PM", menu:[["Butter Chicken","With naan basket",320],["Dal Makhani","Slow-cooked, buttery",220],["Tandoori Roti","Per piece",25]]},
  {id:3, name:"Wok This Way", cuisine:"Indo-Chinese · Stall", price:180, dist:0.4, rating:4.1, emoji:"🥡", color:"#3B2E4A",
    hours:"5:00 PM – 1:00 AM", menu:[["Chilli Garlic Noodles","Extra spicy option",130],["Manchurian Dry","Veg, 8pc",150],["Momos","Steamed, 6pc chicken",120]]},
  {id:4, name:"Spice Route Grill", cuisine:"Mughlai · Kebabs", price:650, dist:2.8, rating:4.6, emoji:"🍢", color:"#4A2E2E",
    hours:"12:00 PM – 11:30 PM", menu:[["Seekh Kebab Platter","6 pieces, mint chutney",380],["Mutton Biryani","Dum-cooked, serves 1",340],["Sheer Khurma","Dessert",90]]},
  {id:5, name:"The Coastal Basket", cuisine:"Kerala · Seafood", price:520, dist:1.9, rating:4.4, emoji:"🐟", color:"#1E4A4A",
    hours:"12:30 PM – 10:00 PM", menu:[["Fish Moilee","Coconut curry, rice",300],["Prawn Roast","Kerala-style",340],["Appam","2 pieces",50]]},
  {id:6, name:"Corner Chaat House", cuisine:"Street Food · Snacks", price:120, dist:0.3, rating:4.2, emoji:"🥙", color:"#4A3B1E",
    hours:"4:00 PM – 11:00 PM", menu:[["Pani Puri","6 pieces",50],["Sev Puri","Plate",60],["Dahi Bhalla","Plate",70]]},
];

let netOnline = true;
let currentTab = 'home';
let activeChip = 'all';

function toggleNet(){
  netOnline = !netOnline;
  const badge = document.getElementById('netbadge');
  const label = document.getElementById('netlabel');
  const sig = document.getElementById('sigicon');
  if(netOnline){
    badge.className = 'netbadge online';
    label.textContent = 'Online · Synced just now';
    sig.textContent = '●●●● 5G';
  } else {
    badge.className = 'netbadge offline';
    label.textContent = 'Offline · Showing cached data (12 min old)';
    sig.textContent = '✈ Airplane mode';
  }
  render();
}

function setTab(tab){
  currentTab = tab;
  document.querySelectorAll('.navitem').forEach(el => el.classList.toggle('active', el.dataset.tab === tab));
  render();
}

function stars(r){
  return r.toFixed(1) + ' ★';
}

function restaurantCard(r, note){
  return `
  <div class="card" onclick="openDetail(${r.id})">
    <div class="thumb" style="background:${r.color}">${r.emoji}</div>
    <div class="card-body">
      <div class="card-top">
        <div class="card-name">${r.name}</div>
        <div class="card-price">₹${r.price} for two</div>
      </div>
      <div class="card-cuisine">${r.cuisine}</div>
      <div class="card-meta">
        <span class="rating">${stars(r.rating)}</span>
        <span>${r.dist} km away</span>
        <span>${r.hours.split('–')[0].trim()} open</span>
      </div>
      ${note ? `<div class="ai-note">${note}</div>` : ''}
    </div>
  </div>`;
}

function renderHome(){
  const list = DATA.filter(r => activeChip === 'all' || (activeChip === 'nearby' && r.dist <= 1) || (activeChip === 'budget' && r.price <= 300) || (activeChip === 'top' && r.rating >= 4.4));
  return `
    <div class="header">
      <h1>OfflineEats</h1>
      <div class="loc">📍 Near Banjara Hills, Hyderabad</div>
    </div>
    <div class="searchrow">
      <div class="searchbox">🔍 <input placeholder="Search restaurants, cuisines..." readonly></div>
    </div>
    <div class="chiprow">
      ${['all','nearby','budget','top'].map(c => `<div class="chip ${activeChip===c?'active':''}" onclick="setChip('${c}')">${c==='all'?'All':c==='nearby'?'Under 1km':c==='budget'?'Under ₹300':'Top rated'}</div>`).join('')}
    </div>
    <div class="sectiontitle">${list.length} places nearby
      <span class="sub">${netOnline ? 'Live data + cached fallback' : 'Cached on your device — updated last time you were online'}</span>
    </div>
    ${list.map(r => restaurantCard(r)).join('') || emptyState('No matches', 'Try a different filter.')}
  `;
}

function emptyState(t1, t2){
  return `<div class="empty"><div class="big">🍽️</div><div class="t1">${t1}</div><div class="t2">${t2}</div></div>`;
}

let aiQuery = "";
let aiResults = null;

function renderAI(){
  return `
    <div class="header">
      <h1>Ask OfflineEats AI</h1>
      <div class="loc">Describe what you want — budget, distance, cravings</div>
    </div>
    <div class="searchrow">
      <div class="searchbox">✦ <input id="aiInput" placeholder="e.g. under ₹500, less than 2km, spicy" value="${aiQuery}" oninput="aiQuery=this.value"></div>
      <button class="ai-btn" onclick="runAI()">Ask</button>
    </div>
    <div class="chiprow">
      ${['Under ₹300, nearby','Under ₹500, 2km','Top rated, any price'].map(q => `<div class="chip" onclick="quickAI('${q}')">${q}</div>`).join('')}
    </div>
    ${aiResults ? renderAIResults() : emptyState('Ask a question above', netOnline ? 'AI will parse your request and rank cached + live results.' : 'Running fully offline using your cached restaurant data and an on-device ranking model.')}
  `;
}

function quickAI(q){ aiQuery = q; runAI(); }

function runAI(){
  // very simple mock parser
  let maxPrice = 100000, maxDist = 100000, wantTop = false;
  const priceMatch = aiQuery.match(/(\d+)\s*(rupee|rs|₹)?/i);
  if(/under|less than|below/i.test(aiQuery) && priceMatch) maxPrice = parseInt(priceMatch[1]);
  const kmMatch = aiQuery.match(/(\d+(\.\d+)?)\s*km/i);
  if(kmMatch) maxDist = parseFloat(kmMatch[1]);
  if(/top|best|rated/i.test(aiQuery)) wantTop = true;

  let results = DATA.filter(r => r.price <= maxPrice && r.dist <= maxDist);
  if(wantTop) results = results.filter(r => r.rating >= 4.3);
  results = results.sort((a,b) => (b.rating*0.5 + (1/b.dist)*0.3) - (a.rating*0.5 + (1/a.dist)*0.3));
  aiResults = results;
  render();
}

function renderAIResults(){
  if(aiResults.length === 0) return emptyState('No matches found', 'Try loosening your budget or distance.');
  return `
    <div class="ai-answer">
      <div class="lbl">${netOnline ? 'AI RECOMMENDATION' : 'ON-DEVICE RECOMMENDATION (OFFLINE)'}</div>
      <div class="txt">Found ${aiResults.length} spot${aiResults.length>1?'s':''} matching your budget and distance, ranked by rating and proximity.</div>
    </div>
    ${aiResults.map(r => restaurantCard(r, `Fits your query · ₹${r.price} · ${r.dist}km · ${r.rating}★`)).join('')}
  `;
}

function renderSaved(){
  return `
    <div class="header"><h1>Saved</h1><div class="loc">Places you've bookmarked for later</div></div>
    ${emptyState('Nothing saved yet', 'Tap the heart on any restaurant card to keep it handy — saved spots stay available offline too.')}
  `;
}

function renderSync(){
  return `
    <div class="header"><h1>Data & Sync</h1><div class="loc">Manage your offline cache</div></div>
    <div class="sync-block">
      <div class="row"><span>Status</span><b>${netOnline ? 'Online' : 'Offline'}</b></div>
      <div class="row"><span>Restaurants cached</span><b>${DATA.length} for this area</b></div>
      <div class="row"><span>Last full sync</span><b>${netOnline ? 'Just now' : '12 minutes ago'}</b></div>
      <div class="row"><span>Cache size</span><b>1.8 MB</b></div>
      <button class="sync-btn" ${netOnline ? '' : 'disabled'} onclick="doSync()">${netOnline ? 'Sync latest data now' : 'Reconnect to sync'}</button>
    </div>
    <div class="sectiontitle">How offline mode works<span class="sub">No internet needed for browsing, GPS distance, or AI filtering once an area is cached.</span></div>
  `;
}

function doSync(){
  alert('Synced! Restaurant list, ratings and menus refreshed for this area.');
}

function setChip(c){ activeChip = c; render(); }

let detailId = null;
function openDetail(id){ detailId = id; render(); }
function closeDetail(){ detailId = null; render(); }

function renderDetail(){
  const r = DATA.find(x => x.id === detailId);
  return `
    <div class="backrow" onclick="closeDetail()">← Back</div>
    <div class="detail-hero" style="background:${r.color}">${r.emoji}</div>
    <div class="detail-name">${r.name}</div>
    <div class="detail-meta">
      <span><b>${stars(r.rating)}</b></span>
      <span>${r.dist} km away</span>
      <span>₹${r.price} for two</span>
      <span>${r.hours}</span>
    </div>
    <div class="sectiontitle">Menu <span class="sub">${netOnline ? 'Live pricing' : 'Cached pricing — may vary slightly'}</span></div>
    <div class="menusec">
      ${r.menu.map(m => `<div class="menu-item"><div><div class="mname">${m[0]}</div><div class="mdesc">${m[1]}</div></div><div class="mprice">₹${m[2]}</div></div>`).join('')}
    </div>
  `;
}

function render(){
  const el = document.getElementById('screen');
  if(detailId !== null){ el.innerHTML = renderDetail(); return; }
  if(currentTab === 'home') el.innerHTML = renderHome();
  else if(currentTab === 'ai') el.innerHTML = renderAI();
  else if(currentTab === 'saved') el.innerHTML = renderSaved();
  else if(currentTab === 'sync') el.innerHTML = renderSync();
}

render();
</script>
</body>
</html>
